name: CI cell

on:
  workflow_call:
    inputs:
      cell-id:
        required: true
        type: string
      os:
        required: true
        type: string
      c-compiler:
        required: true
        type: string
      cpp-compiler:
        required: true
        type: string
      build-type:
        required: false
        type: string
        default: Release

jobs:
  build:
    name: Build (${{ inputs.cell-id }})
    runs-on: ${{ inputs.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Clang (Ubuntu)
        if: runner.os == 'Linux' && inputs.c-compiler == 'clang'
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Setup MSYS2 MinGW
        if: runner.os == 'Windows' && inputs.c-compiler == 'mingw'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make

      - name: Install test dependencies (STLSoft + shwild + xTests)
        shell: bash
        run: |
          set -euxo pipefail

          DEPS="${RUNNER_TEMP}/sis-deps"
          STLSRC="${RUNNER_TEMP}/stlsoft-src"
          STLBUILD="${RUNNER_TEMP}/stlsoft-build"
          SHWSRC="${RUNNER_TEMP}/shwild-src"
          SHWBUILD="${RUNNER_TEMP}/shwild-build"
          XTSRC="${RUNNER_TEMP}/xtests-src"
          XTBUILD="${RUNNER_TEMP}/xtests-build"

          mkdir -p "$DEPS"

          # 1. STLSoft
          git clone --depth 1 https://github.com/synesissoftware/STLSoft "$STLSRC"
          if [ "${{ inputs.c-compiler }}" = "cl" ]; then
            cmake -S "$STLSRC" -B "$STLBUILD" \
              -DCMAKE_DISABLE_FIND_PACKAGE_MFC=TRUE \
              -DCMAKE_INSTALL_PREFIX="$DEPS" \
              -DBUILD_EXAMPLES=OFF \
              -DBUILD_TESTING=OFF
            cmake --build "$STLBUILD" --config "${{ inputs.build-type }}" --parallel
            cmake --install "$STLBUILD" --config "${{ inputs.build-type }}"
          elif [ "${{ inputs.c-compiler }}" = "mingw" ]; then
            export PATH="/mingw64/bin:$PATH"
            cmake -S "$STLSRC" -B "$STLBUILD" -G "MinGW Makefiles" \
              -DCMAKE_BUILD_TYPE="${{ inputs.build-type }}" \
              -DCMAKE_INSTALL_PREFIX="$DEPS" \
              -DBUILD_EXAMPLES=OFF \
              -DBUILD_TESTING=OFF
            cmake --build "$STLBUILD" --parallel 2
            cmake --install "$STLBUILD"
          else
            cmake -S "$STLSRC" -B "$STLBUILD" \
              -DCMAKE_BUILD_TYPE="${{ inputs.build-type }}" \
              -DCMAKE_C_COMPILER="${{ inputs.c-compiler }}" \
              -DCMAKE_CXX_COMPILER="${{ inputs.cpp-compiler }}" \
              -DCMAKE_INSTALL_PREFIX="$DEPS" \
              -DBUILD_EXAMPLES=OFF \
              -DBUILD_TESTING=OFF
            cmake --build "$STLBUILD" --parallel
            cmake --install "$STLBUILD"
          fi

          # 2. shwild
          git clone --depth 1 https://github.com/synesissoftware/shwild "$SHWSRC"
          if [ "${{ inputs.c-compiler }}" = "cl" ]; then
            cmake -S "$SHWSRC" -B "$SHWBUILD" \
              -DCMAKE_DISABLE_FIND_PACKAGE_MFC=TRUE \
              -DCMAKE_INSTALL_PREFIX="$DEPS" \
              -DCMAKE_PREFIX_PATH="$DEPS" \
              -DBUILD_EXAMPLES=OFF \
              -DBUILD_TESTING=OFF
            cmake --build "$SHWBUILD" --config "${{ inputs.build-type }}" --parallel
            cmake --install "$SHWBUILD" --config "${{ inputs.build-type }}"
          elif [ "${{ inputs.c-compiler }}" = "mingw" ]; then
            export PATH="/mingw64/bin:$PATH"
            cmake -S "$SHWSRC" -B "$SHWBUILD" -G "MinGW Makefiles" \
              -DCMAKE_BUILD_TYPE="${{ inputs.build-type }}" \
              -DCMAKE_INSTALL_PREFIX="$DEPS" \
              -DCMAKE_PREFIX_PATH="$DEPS" \
              -DBUILD_EXAMPLES=OFF \
              -DBUILD_TESTING=OFF
            cmake --build "$SHWBUILD" --parallel 2
            cmake --install "$SHWBUILD"
          else
            cmake -S "$SHWSRC" -B "$SHWBUILD" \
              -DCMAKE_BUILD_TYPE="${{ inputs.build-type }}" \
              -DCMAKE_C_COMPILER="${{ inputs.c-compiler }}" \
              -DCMAKE_CXX_COMPILER="${{ inputs.cpp-compiler }}" \
              -DCMAKE_INSTALL_PREFIX="$DEPS" \
              -DCMAKE_PREFIX_PATH="$DEPS" \
              -DBUILD_EXAMPLES=OFF \
              -DBUILD_TESTING=OFF
            cmake --build "$SHWBUILD" --parallel
            cmake --install "$SHWBUILD"
          fi

          # 3. xTests
          git clone --depth 1 https://github.com/synesissoftware/xTests "$XTSRC"
          if [ "${{ inputs.c-compiler }}" = "cl" ]; then
            cmake -S "$XTSRC" -B "$XTBUILD" \
              -DCMAKE_DISABLE_FIND_PACKAGE_MFC=TRUE \
              -DCMAKE_INSTALL_PREFIX="$DEPS" \
              -DCMAKE_PREFIX_PATH="$DEPS" \
              -DBUILD_EXAMPLES=OFF \
              -DBUILD_TESTING=OFF
            cmake --build "$XTBUILD" --config "${{ inputs.build-type }}" --parallel
            cmake --install "$XTBUILD" --config "${{ inputs.build-type }}"
          elif [ "${{ inputs.c-compiler }}" = "mingw" ]; then
            export PATH="/mingw64/bin:$PATH"
            cmake -S "$XTSRC" -B "$XTBUILD" -G "MinGW Makefiles" \
              -DCMAKE_BUILD_TYPE="${{ inputs.build-type }}" \
              -DCMAKE_INSTALL_PREFIX="$DEPS" \
              -DCMAKE_PREFIX_PATH="$DEPS" \
              -DBUILD_EXAMPLES=OFF \
              -DBUILD_TESTING=OFF
            cmake --build "$XTBUILD" --parallel 2
            cmake --install "$XTBUILD"
          else
            cmake -S "$XTSRC" -B "$XTBUILD" \
              -DCMAKE_BUILD_TYPE="${{ inputs.build-type }}" \
              -DCMAKE_C_COMPILER="${{ inputs.c-compiler }}" \
              -DCMAKE_CXX_COMPILER="${{ inputs.cpp-compiler }}" \
              -DCMAKE_INSTALL_PREFIX="$DEPS" \
              -DCMAKE_PREFIX_PATH="$DEPS" \
              -DBUILD_EXAMPLES=OFF \
              -DBUILD_TESTING=OFF
            cmake --build "$XTBUILD" --parallel
            cmake --install "$XTBUILD"
          fi

      - name: Configure via prepare_cmake.sh
        shell: bash
        run: |
          set -euo pipefail
          export SIS_CMAKE_BUILD_DIR="${{ github.workspace }}/build"
          export SIS_CMAKE_CONFIG="${{ inputs.build-type }}"
          export CMAKE_PREFIX_PATH="${RUNNER_TEMP}/sis-deps"
          # Bash 3.2 (macOS) + set -u treats an empty "${arr[@]}" as
          # unbound; use the ${arr[@]+…} form so Release/non-mingw is OK.
          PREPARE_ARGS=()
          if [ "${{ inputs.build-type }}" = "Debug" ]; then
            PREPARE_ARGS+=(-d)
          fi
          if [ "${{ inputs.c-compiler }}" = "mingw" ]; then
            export PATH="/mingw64/bin:$PATH"
            PREPARE_ARGS+=(--mingw)
          elif [ "${{ inputs.c-compiler }}" != "cl" ]; then
            export CC="${{ inputs.c-compiler }}"
            export CXX="${{ inputs.cpp-compiler }}"
          fi
          ./prepare_cmake.sh ${PREPARE_ARGS[@]+"${PREPARE_ARGS[@]}"}

      - name: Build via build_cmake.sh
        shell: bash
        run: |
          set -euo pipefail
          export SIS_CMAKE_BUILD_DIR="${{ github.workspace }}/build"
          export SIS_CMAKE_CONFIG="${{ inputs.build-type }}"
          if [ "${{ inputs.c-compiler }}" = "mingw" ]; then
            export PATH="/mingw64/bin:$PATH"
          fi
          ./build_cmake.sh

      - name: CTest via ctest_cmake.sh
        shell: bash
        run: |
          set -euo pipefail
          export SIS_CMAKE_BUILD_DIR="${{ github.workspace }}/build"
          export SIS_CMAKE_CONFIG="${{ inputs.build-type }}"
          if [ "${{ inputs.c-compiler }}" = "mingw" ]; then
            export PATH="/mingw64/bin:$PATH"
          fi
          ./ctest_cmake.sh -M

      - name: Upload build tree
        uses: actions/upload-artifact@v4
        with:
          name: sis-build-${{ inputs.cell-id }}
          path: build
          retention-days: 1

  test-unit:
    name: Unit tests (${{ inputs.cell-id }})
    needs: build
    runs-on: ${{ inputs.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 MinGW
        id: msys2
        if: runner.os == 'Windows' && inputs.c-compiler == 'mingw'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-toolchain

      - name: Download build tree
        uses: actions/download-artifact@v4
        with:
          name: sis-build-${{ inputs.cell-id }}
          path: build

      - name: Run unit tests
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          SIS_CMAKE_BUILD_DIR="${{ github.workspace }}/build" ./run_all_unit_tests.sh -M --unit-only

      - name: Run unit tests
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set SIS_CMAKE_BUILD_DIR=%GITHUB_WORKSPACE%\build
          if /I "${{ inputs.c-compiler }}"=="mingw" set "PATH=${{ steps.msys2.outputs.msys2-location }}\mingw64\bin;%PATH%"
          REM Dogfood the aggregate .cmd; it CALLs run_all_unit_tests.cmd.
          call run_all_automated_tests.cmd --unit-only

  test-component:
    name: Component tests (${{ inputs.cell-id }})
    needs: test-unit
    runs-on: ${{ inputs.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 MinGW
        id: msys2
        if: runner.os == 'Windows' && inputs.c-compiler == 'mingw'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-toolchain

      - name: Download build tree
        uses: actions/download-artifact@v4
        with:
          name: sis-build-${{ inputs.cell-id }}
          path: build

      - name: Run component tests
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          SIS_CMAKE_BUILD_DIR="${{ github.workspace }}/build" ./run_all_component_tests.sh -M --component-only

      - name: Run component tests
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set SIS_CMAKE_BUILD_DIR=%GITHUB_WORKSPACE%\build
          if /I "${{ inputs.c-compiler }}"=="mingw" set "PATH=${{ steps.msys2.outputs.msys2-location }}\mingw64\bin;%PATH%"
          REM Dogfood the aggregate .cmd; it CALLs run_all_component_tests.cmd.
          call run_all_automated_tests.cmd --component-only

  test-performance:
    name: Performance tests (${{ inputs.cell-id }})
    needs: test-component
    runs-on: ${{ inputs.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 MinGW
        id: msys2
        if: runner.os == 'Windows' && inputs.c-compiler == 'mingw'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-toolchain

      - name: Download build tree
        uses: actions/download-artifact@v4
        with:
          name: sis-build-${{ inputs.cell-id }}
          path: build

      - name: Run performance tests
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          SIS_CMAKE_BUILD_DIR="${{ github.workspace }}/build" ./run_all_performance_tests.sh -M

      - name: Run performance tests
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set SIS_CMAKE_BUILD_DIR=%GITHUB_WORKSPACE%\build
          if /I "${{ inputs.c-compiler }}"=="mingw" set "PATH=${{ steps.msys2.outputs.msys2-location }}\mingw64\bin;%PATH%"
          call run_all_performance_tests.cmd

  test-scratch:
    name: Scratch tests (${{ inputs.cell-id }})
    needs: test-performance
    continue-on-error: true
    runs-on: ${{ inputs.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 MinGW
        id: msys2
        if: runner.os == 'Windows' && inputs.c-compiler == 'mingw'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-toolchain

      - name: Download build tree
        uses: actions/download-artifact@v4
        with:
          name: sis-build-${{ inputs.cell-id }}
          path: build

      - name: Run scratch tests
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          SIS_CMAKE_BUILD_DIR="${{ github.workspace }}/build" ./run_all_scratch_tests.sh -M

      - name: Run scratch tests
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set SIS_CMAKE_BUILD_DIR=%GITHUB_WORKSPACE%\build
          if /I "${{ inputs.c-compiler }}"=="mingw" set "PATH=${{ steps.msys2.outputs.msys2-location }}\mingw64\bin;%PATH%"
          call run_all_scratch_tests.cmd

  run-examples:
    name: Examples (${{ inputs.cell-id }})
    needs: test-scratch
    runs-on: ${{ inputs.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 MinGW
        id: msys2
        if: runner.os == 'Windows' && inputs.c-compiler == 'mingw'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-toolchain

      - name: Download build tree
        uses: actions/download-artifact@v4
        with:
          name: sis-build-${{ inputs.cell-id }}
          path: build

      - name: Run examples
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          SIS_CMAKE_BUILD_DIR="${{ github.workspace }}/build" ./run_all_examples.sh -M

      - name: Run examples
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set SIS_CMAKE_BUILD_DIR=%GITHUB_WORKSPACE%\build
          if /I "${{ inputs.c-compiler }}"=="mingw" set "PATH=${{ steps.msys2.outputs.msys2-location }}\mingw64\bin;%PATH%"
          call run_all_examples.cmd
